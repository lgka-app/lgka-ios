name: LGKA
options:
  bundleIdPrefix: com.lgka
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  xcodeVersion: "26.6"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
packages:
  LGKACore:
    path: .
  Vortex:
    url: https://github.com/twostraws/Vortex
    from: 1.0.4
schemes:
  LGKA:
    build:
      targets:
        LGKA: all
        LGKAUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LGKAUITests]
    archive:
      config: Release
targets:
  LGKAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LGKA
    settings:
      base:
        DEVELOPMENT_TEAM: M8M22924DJ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LGKA
        PRODUCT_BUNDLE_IDENTIFIER: com.lgka.uitests
  LGKA:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
          - "AppIcon.icon/**"
      - path: App/AppIcon.icon   # Icon Composer bundle (iOS 26 layered icon); Xcode compiles it into the asset catalog
    dependencies:
      - package: LGKACore
        product: LGKACore
      - package: Vortex
        product: Vortex
    entitlements:
      path: App/LGKA.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.lgka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lgka
        DEVELOPMENT_TEAM: M8M22924DJ
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 3.0.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LGKA+
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
