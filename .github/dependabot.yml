version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # fastlane and its gems (release pipeline only)
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      fastlane:
        patterns: ["*"]
