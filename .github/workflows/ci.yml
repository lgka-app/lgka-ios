name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: LGKACore (swift build + golden parity tests)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lgka-app/verification
          path: verification # checkout v7 refuses paths outside the workspace
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
        env:
          LGKA_VERIFICATION_DIR: ${{ github.workspace }}/verification

  app:
    name: LGKA app (xcodegen + xcodebuild)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          xcodebuild -scheme LGKA -project LGKA.xcodeproj \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify || \
          xcodebuild -scheme LGKA -project LGKA.xcodeproj \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
